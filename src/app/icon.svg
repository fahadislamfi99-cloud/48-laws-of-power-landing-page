<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#070709" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E4B8" />
      <stop offset="25%" stop-color="#D4AF6E" />
      <stop offset="50%" stop-color="#C8A45C" />
      <stop offset="85%" stop-color="#9A7830" />
      <stop offset="100%" stop-color="#725418" />
    </linearGradient>

    <!-- Shield Face Gradient -->
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D19C" />
      <stop offset="100%" stop-color="#C8A45C" />
    </linearGradient>
    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B88F3C" />
      <stop offset="100%" stop-color="#805C16" />
    </linearGradient>

    <!-- Gold Border Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#C8A45C" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Outer Shield Trim -->
  <path d="M64 26 L94 40 L84 82 L64 102 L44 82 L34 40 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round" filter="url(#goldGlow)" />

  <!-- Shield Body Left (Highlight) -->
  <path d="M64 30 L90 42 L80 80 L64 97 Z" fill="url(#shieldRight)" />
  <!-- Shield Body Right (Shadow) -->
  <path d="M64 30 L38 42 L48 80 L64 97 Z" fill="url(#shieldLeft)" />

  <!-- Crown on Top of Shield -->
  <path d="M48 24 L52 14 L64 20 L76 14 L80 24 Z" fill="url(#goldGrad)" />
  <circle cx="52" cy="13" r="1.5" fill="#FFF" />
  <circle cx="64" cy="19" r="1.5" fill="#FFF" />
  <circle cx="76" cy="13" r="1.5" fill="#FFF" />

  <!-- Central "48" Typography in Obsidian Black -->
  <text x="64" y="74" text-anchor="middle" font-family="'Cinzel', 'Times New Roman', 'Georgia', serif" font-weight="900" font-size="34" fill="#0A0A0C" letter-spacing="-1">48</text>
</svg>
